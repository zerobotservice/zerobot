<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Redirect</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const url = params.get("url");

        if (url) {
            location.replace(url);
        } else {
            document.body.innerHTML = "<h2>url 파라미터가 없습니다.</h2>";
        }
    </script>
</head>
<body>
    이동 중...
</body>
</html>
